<VirtualHost *:80>
    ServerName localhost
    DocumentRoot "/var/www/html/public"
    DirectoryIndex index.php index.html

    # I file interni al progetto non sono accessibili direttamente dal browser.
    <Directory "/var/www/html">
        Options -Indexes
        AllowOverride None
        Require all denied
    </Directory>

    # Pagine pubbliche del sito.
    <Directory "/var/www/html/public">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Endpoint PHP per i form: sono fuori da public, quindi li esponiamo
    # soltanto tramite questo alias dedicato.
    Alias "/actions/" "/var/www/html/actions/"
    <Directory "/var/www/html/actions">
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # Ogni file PHP viene eseguito dal servizio PHP-FPM sulla rete Docker.
    <FilesMatch "\.php$">
        SetHandler "proxy:fcgi://php:9000"
    </FilesMatch>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
